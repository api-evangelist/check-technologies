aid: check-technologies
name: Check Technologies
description: >-
  Check Technologies (Check) is a Stripe-incubated embedded-payroll infrastructure
  company whose API lets vertical SaaS, HR, and time-tracking platforms embed
  full-service payroll directly into their own products. The Check API handles
  the hard parts of running payroll — worker onboarding, pay schedules, earnings
  and deductions, tax calculation, filing and remittance across federal, state,
  and local jurisdictions, contractor payments, and money movement — behind a
  white-labeled, developer-first surface. Platforms integrate through the REST
  API, embeddable white-labeled React Components (Company Onboard, Run Payroll,
  W-4 / tax setup, bank connection via Plaid, filing authorization), webhooks,
  a Model Context Protocol server for AI agents, and a Python CLI. Check is
  backed by Stripe, Index Ventures, Thrive Capital, Bedrock Capital, and
  Battery Ventures, and powers payroll for platforms including Homebase.
