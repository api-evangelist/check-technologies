  set: company.trade_name
  value: "NSF Co."
- scenario: No account / funding failure
  set: company.trade_name
  value: "No Account Co."
- scenario: Closed bank account (direct deposit) failure
  set: employee.first_name = "Barry", employee.last_name = "BadAccount"
  value: "Barry BadAccount"
